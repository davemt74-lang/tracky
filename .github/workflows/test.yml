name: Tracky CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build deploy ZIP
        run: zip -r tracky-v0.2-deploy.zip . -x ".git/*" "tracky-v0.2-deploy.zip"
      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky-v0.2-deploy
          path: tracky-v0.2-deploy.zip
          if-no-files-found: error
