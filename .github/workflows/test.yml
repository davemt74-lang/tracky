name: Tracky CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate codebase
        run: npm run validate

      - name: Build deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist tracky-v0.9-deploy.zip
          mkdir -p dist/tracky-v0.9/src
          cp index.html agent-eyes.js participants.html participants.js participant-voice.js experiments.html tracker.html tracker-experiment.js games.html vertical-motion.html vertical-motion.js styles.css README.md package.json dist/tracky-v0.9/
          cp src/tracker-core.js src/movement-core.js src/gameplay-core.js src/participant-core.js src/participant-store.js src/identity-engine.js src/room-tracking-core.js src/voice-core.js src/voice-engine.js src/room-audio-engine.js src/room-audio-worklet.js src/model-config.js src/perception-core.js src/behavior-core.js dist/tracky-v0.9/src/
          cd dist
          zip -r ../tracky-v0.9-deploy.zip tracky-v0.9

      - name: Verify deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t tracky-v0.9-deploy.zip
          unzip -l tracky-v0.9-deploy.zip | grep -F "tracky-v0.9/agent-eyes.js"
          unzip -l tracky-v0.9-deploy.zip | grep -F "tracky-v0.9/src/perception-core.js"
          unzip -l tracky-v0.9-deploy.zip | grep -F "tracky-v0.9/src/behavior-core.js"
          sha256sum tracky-v0.9-deploy.zip

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky-v0.9-deploy
          path: tracky-v0.9-deploy.zip
          if-no-files-found: error
          retention-days: 30
