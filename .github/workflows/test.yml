name: Tracky CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build deploy ZIP
        shell: bash
        run: |
          rm -rf dist tracky-v0.6-deploy.zip
          mkdir -p dist/tracky-v0.6/src
          cp index.html games.html vertical-motion.html participants.html app.js vertical-motion.js participants.js participant-voice.js styles.css README.md package.json dist/tracky-v0.6/
          cp src/tracker-core.js src/movement-core.js src/gameplay-core.js src/participant-core.js src/participant-store.js src/identity-engine.js src/room-tracking-core.js src/voice-core.js src/voice-engine.js src/room-audio-engine.js dist/tracky-v0.6/src/
          cd dist
          zip -r ../tracky-v0.6-deploy.zip tracky-v0.6

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky-v0.6-deploy
          path: tracky-v0.6-deploy.zip
          if-no-files-found: error
          retention-days: 30
